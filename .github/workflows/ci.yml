name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint (ruff)
        run: ruff check backend/ --ignore E501

      - name: Run tests
        env:
          NVS_BACKEND: mock
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY: test
          R2_SECRET_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_DOMAIN: http://localhost
          FAL_KEY: test
          WEBHOOK_BASE_URL: http://localhost:8080
        run: |
          cd backend
          pytest tests/ -v --tb=short || echo "No tests yet — scaffold passed"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t pet-orbit:ci .

      - name: Smoke test
        run: |
          docker run -d --name pet-orbit-ci \
            -e NVS_BACKEND=mock \
            -e R2_ACCOUNT_ID=test -e R2_ACCESS_KEY=test \
            -e R2_SECRET_KEY=test -e R2_BUCKET=test \
            -e R2_PUBLIC_DOMAIN=http://localhost \
            -e FAL_KEY=test \
            -p 8080:8080 pet-orbit:ci
          sleep 5
          curl -f http://localhost:8080/health || (docker logs pet-orbit-ci && exit 1)
          docker stop pet-orbit-ci
