version: '3.9'

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NVS_BACKEND=mock
      - HIGGSFIELD_API_KEY=${HIGGSFIELD_API_KEY:-}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      - NVS_BACKEND=mock
      - HIGGSFIELD_API_KEY=${HIGGSFIELD_API_KEY:-}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: rq worker --url redis://redis:6379

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
